[package]
name = "dotenv-ng"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
categories.workspace = true
homepage.workspace = true
keywords.workspace = true
repository.workspace = true
authors.workspace = true
description = "Load environment variables from .env files"
readme = true
include = ["src/**", "tests/**", ".env", "README.md", "LICENSE"]

[lib]
name = "dotenv"

[[bin]]
name = "dotenv-ng"
required-features = ["cli"]

[dependencies]
clap = { version = "=4.5.16", features = ["derive"], optional = true }
dotenv-ng-core = { version = "1.0.0", path = "../dotenv-ng-core" }
dotenv-ng-macros = { version = "1.0.0", path = "../dotenv-ng-macros", optional = true }
shell-words = { version = "=1.1.1", optional = true }

[features]
default = []
cli = ["dep:clap", "dep:shell-words"]
macros = ["dep:dotenv-ng-macros"]

[lints]
workspace = true
